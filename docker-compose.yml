name: filevault

x-app-environment: &app-environment
  APP_NAME: FileVault
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_KEY: ${APP_KEY:?Run bash start.sh to generate deployment secrets}
  APP_URL: ${APP_URL:-http://localhost:8085}
  APP_LOCALE: en
  APP_TIMEZONE: Asia/Kolkata
  INSTALLED: 'true'
  LOCAL_FILE_PORTAL: 'true'
  FILEVAULT_STORAGE_LOCK: 'true'
  FILEVAULT_FSYNC: 'true'
  DEPLOYMENT_ID: ${DEPLOYMENT_ID:?Missing deployment identity}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: '3306'
  DB_DATABASE: ${DB_DATABASE:-filevault}
  DB_USERNAME: ${DB_USERNAME:-filevault}
  DB_PASSWORD: ${DB_PASSWORD:?Missing database password}
  SESSION_DRIVER: file
  SESSION_COOKIE: filevault_docker_session
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  MAIL_MAILER: log
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  BILLING_ENABLED: 'false'
  WORKSPACES_ENABLED: 'false'
  NOTIFICATIONS_ENABLED: 'false'
  CLOCKWORK_ENABLED: 'false'
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@filevault.local}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Missing initial admin password}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-filevault}
      MARIADB_USER: ${DB_USERNAME:-filevault}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Missing database password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Missing root database password}
      MARIADB_ROOT_HOST: localhost
    command: ['--innodb-flush-log-at-trx-commit=1', '--innodb-doublewrite=ON', '--max-allowed-packet=128M']
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      options: {max-size: '10m', max-file: '3'}

  app:
    build: {context: ., dockerfile: Dockerfile}
    image: filevault-app:local
    restart: unless-stopped
    stop_grace_period: 5m
    ports:
      - '${APP_PORT:-8085}:80'
    environment: *app-environment
    volumes:
      - runtime:/var/www/html/storage
      - uploads:/var/www/html/storage/app/server-storage
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'php', '/usr/local/bin/filevault-health']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    logging:
      options: {max-size: '10m', max-file: '3'}

  backup:
    image: filevault-app:local
    entrypoint: ['/usr/local/bin/filevault-backup-loop']
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      <<: *app-environment
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_UID: ${BACKUP_UID:-1000}
      BACKUP_GID: ${BACKUP_GID:-1000}
      BACKUP_TARGET_ID: ${BACKUP_TARGET_ID:?Missing backup target identity}
    volumes:
      - runtime:/var/www/html/storage
      - uploads:/var/www/html/storage/app/server-storage:ro
      - type: bind
        source: ${BACKUP_DIR:?Missing host backup directory}
        target: /backups
        bind: {create_host_path: false}
      - type: bind
        source: ${FILEVAULT_ENV_FILE:-.env.docker}
        target: /run/filevault/deployment.env
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: ['CMD', '/usr/local/bin/filevault-backup-health']
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 30m
    logging:
      options: {max-size: '10m', max-file: '5'}

volumes:
  database:
    external: true
    name: ${DB_VOLUME:?Missing database volume}
  uploads:
    external: true
    name: ${FILES_VOLUME:?Missing uploads volume}
  runtime:
    external: true
    name: ${RUNTIME_VOLUME:?Missing runtime volume}
